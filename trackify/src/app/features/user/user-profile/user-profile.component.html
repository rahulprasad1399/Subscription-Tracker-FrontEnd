<div class="w-full max-w-5xl mx-auto px-4 py-8 relative">
  <div>
    <header>
      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 class="text-huge font-bold tracking-tight text-teal-400">
            Profile
          </h2>
          <p class="text-muted mt-1 text-sm">
            Update your personal information
          </p>
        </div>
      </div>
    </header>

    <!-- Profile Card -->
    <div class="bg-card border border-border rounded-xl p-6">
      <form class="flex flex-col gap-6">
        <!-- Profile Image Section -->
        <div class="flex items-center gap-6">
          <div
            class="w-24 h-24 rounded-full overflow-hidden border border-border"
          >
            <img
              [src]="
                profilePhotoUrl ||
                'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTHviSXg4IoEnfXdnG0XRI1FrVUhc2zdo3JLVujaQkBcE9V7k5Z5IHwlE-CJixt4GbVWaAAnackYlSF4HW79NMsPQO7JmbL1aA4BWQCZuV_jQ&s=10'
              "
              alt="Profile Photo"
              class="w-full h-full object-cover"
            />
          </div>

          <div>
            <label class="block">
              <button
                type="button"
                class="px-4 py-2 bg-teal-400 text-white rounded-lg hover:bg-teal-500 transition-all"
                (click)="fileInput.click()"
              >
                Change Photo
              </button>
            </label>

            <input
              hidden
              #fileInput
              type="file"
              (change)="onPhotoSelected($event)"
            />
          </div>
        </div>

        <!-- Full Name -->
        <div>
          <label class="text-sm text-muted">Full Name</label>
          <input
            type="text"
            [(ngModel)]="fullName"
            name="fullName"
            class="mt-1 w-full px-4 py-2 bg-background border border-border rounded-lg text-main focus:outline-none focus:ring-2 focus:ring-teal-400/40"
          />
        </div>

        <!-- Email -->
        <div>
          <label class="text-sm text-muted">Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            class="mt-1 w-full px-4 py-2 bg-background border border-border rounded-lg text-main focus:outline-none focus:ring-2 focus:ring-teal-400/40"
          />
        </div>

        <!-- Save Button -->
        <div class="flex justify-end mt-4">
          <button
            type="button"
            (click)="saveChanges()"
            class="px-6 py-2 bg-teal-400 text-white rounded-lg hover:bg-teal-500 transition-all"
          >
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
