@if(isLoading()){
    <div class="flex flex-row gap-6 animate-pulse">

  <!-- Monthly Spend Skeleton -->
  <div class="w-2/3 bg-card rounded-xl shadow-sm p-4">
    <div class="h-6 w-32 bg-gray-300 rounded mb-4"></div>
    <div class="h-64 bg-gray-200 rounded"></div>
  </div>

  <div class="w-1/3 flex flex-col gap-6">

    <!-- Category Breakdown Skeleton -->
    <div class="bg-card rounded-xl shadow-sm p-4">
      <div class="h-6 w-40 bg-gray-300 rounded mb-4"></div>
      <div class="h-40 bg-gray-200 rounded"></div>
    </div>

    <!-- Distribution Skeleton -->
    <div class="bg-card rounded-xl shadow-sm p-4">
      <div class="h-6 w-32 bg-gray-300 rounded mb-4"></div>
      <div class="h-40 bg-gray-200 rounded-full"></div>
    </div>

  </div>
</div>

}
@else {

    <div class="flex flex-row gap-6 ">
      
      <div class="w-2/3  bg-card rounded-xl shadow-sm p-4 ">
        <h3 class="text-lg font-semibold text-main mb-4 pl-2">Monthly Spend</h3>
        <apx-chart
          [series]="chartOptionsMonthlySpend.series"
          [chart]="chartOptionsMonthlySpend.chart"
          [xaxis]="chartOptionsMonthlySpend.xaxis"
          [dataLabels]="chartOptionsMonthlySpend.dataLabels"
          [stroke]="chartOptionsMonthlySpend.stroke"
          [grid]="chartOptionsMonthlySpend.grid"
        >
        </apx-chart>
      </div>
    
      <div class="w-1/3 flex flex-col gap-6">
        
        <div class="bg-card rounded-xl shadow-sm p-4 ">
           <h3 class="text-lg font-semibold text-main mb-2 pl-2">Activity Status Breakdown</h3>
          <apx-chart
            [series]="chartOptionsBarChart.series"
            [chart]="chartOptionsBarChart.chart"
            [dataLabels]="chartOptionsBarChart.dataLabels"
            [plotOptions]="chartOptionsBarChart.plotOptions"
            [yaxis]="chartOptionsBarChart.yaxis"
            [xaxis]="chartOptionsBarChart.xaxis"
          ></apx-chart>
        </div>
    
        <div class="bg-card  rounded-xl shadow-sm p-4 ">
           <h3 class="text-lg font-semibold text-main mb-2 pl-2">Category Breakdown</h3>
          <apx-chart
            [series]="chartOptionsPrieChart.series"
            [chart]="chartOptionsPrieChart.chart"
            [labels]="chartOptionsPrieChart.labels"
            [responsive]="chartOptionsPrieChart.responsive"
            
          ></apx-chart>
        </div>
    
      </div>
    </div>
}
