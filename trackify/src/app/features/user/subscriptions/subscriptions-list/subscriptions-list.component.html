
<div class="container mx-auto px-4 py-8">
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Subscriptions</h1>
    </div>

    <div class="overflow-x-auto shadow-md rounded-lg">
        <table class="w-full bg-white">
            <thead>
                <tr class="bg-blue-600 text-white">
                    <th class="px-6 py-3 text-left text-sm font-semibold">Service Name</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold">Amount</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold">Billing Cycle</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold">Status</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for(subscription of subscriptions().subscriptions; track subscription.id) 
                {
                    <tr class="border-b border-gray-200 hover:bg-gray-50">
                        <td class="px-6 py-4 text-gray-800">{{subscription?.id}}</td>
                        <td class="px-6 py-4 text-gray-800">$15.99</td>
                        <td class="px-6 py-4 text-gray-800">Monthly</td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm">Active</span>
                        </td>
                        <td class="px-6 py-4">
                            <button class="text-blue-600 hover:text-blue-800 mr-3">Edit</button>
                            <button class="text-red-600 hover:text-red-800">Delete</button>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
