<div class="min-h-screen flex flex-col items-center justify-center bg-app transition-colors duration-300">
  
  <div class="relative overflow-hidden w-[768px] max-w-full min-h-[480px] bg-card rounded-[30px] shadow-2xl">
    
    <div 
      class="absolute top-0 left-0 h-full w-1/2 transition-all duration-700 ease-in-out"
      [class]="isActive ? 'translate-x-full opacity-100 z-50 animate-move' : 'opacity-0 z-10'"
    >
      <form class="bg-card flex flex-col items-center justify-center h-full px-10 text-center">
        <h1 class="font-bold text-huge text-main mb-4">Create Account</h1>
        
        <div class="flex gap-4 mb-4">
          <a href="#" class="border border-muted/30 text-main rounded-lg w-10 h-10 flex justify-center items-center hover:bg-app transition-colors"><i class="fa-brands fa-google-plus-g"></i></a>
          <a href="#" class="border border-muted/30 text-main rounded-lg w-10 h-10 flex justify-center items-center hover:bg-app transition-colors"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" class="border border-muted/30 text-main rounded-lg w-10 h-10 flex justify-center items-center hover:bg-app transition-colors"><i class="fa-brands fa-github"></i></a>
          <a href="#" class="border border-muted/30 text-main rounded-lg w-10 h-10 flex justify-center items-center hover:bg-app transition-colors"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
        
        <span class="text-tiny text-muted mb-2">or use your email for registration</span>
        
        <input type="text" placeholder="Name" class="bg-app text-main placeholder-muted border-none outline-none text-sm rounded-lg px-4 py-3 w-full my-2 focus:ring-1 focus:ring-primary" />
        <input type="email" placeholder="Email" class="bg-app text-main placeholder-muted border-none outline-none text-sm rounded-lg px-4 py-3 w-full my-2 focus:ring-1 focus:ring-primary" />
        <input type="password" placeholder="Password" class="bg-app text-main placeholder-muted border-none outline-none text-sm rounded-lg px-4 py-3 w-full my-2 focus:ring-1 focus:ring-primary" />
        
        <button class="bg-primary text-white text-tiny font-bold py-3 px-10 rounded-lg uppercase tracking-wider mt-4 hover:opacity-90 transition-opacity">
          Sign Up
        </button>
      </form>
    </div>

    <div 
      class="absolute top-0 left-0 h-full w-1/2 z-20 transition-all duration-700 ease-in-out"
      [class.translate-x-full]="isActive"
    >
      <form class="bg-card flex flex-col items-center justify-center h-full px-10 text-center">
        <h1 class="font-bold text-huge text-main mb-4">Sign In</h1>
        
        <div class="flex gap-4 mb-4">
          <a href="#" class="border border-muted/30 text-main rounded-lg w-10 h-10 flex justify-center items-center hover:bg-app transition-colors"><i class="fa-brands fa-google-plus-g"></i></a>
          <a href="#" class="border border-muted/30 text-main rounded-lg w-10 h-10 flex justify-center items-center hover:bg-app transition-colors"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" class="border border-muted/30 text-main rounded-lg w-10 h-10 flex justify-center items-center hover:bg-app transition-colors"><i class="fa-brands fa-github"></i></a>
          <a href="#" class="border border-muted/30 text-main rounded-lg w-10 h-10 flex justify-center items-center hover:bg-app transition-colors"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
        
        <span class="text-tiny text-muted mb-2">or use your email password</span>
        
        <input type="email" placeholder="Email" class="bg-app text-main placeholder-muted border-none outline-none text-sm rounded-lg px-4 py-3 w-full my-2 focus:ring-1 focus:ring-primary" />
        <input type="password" placeholder="Password" class="bg-app text-main placeholder-muted border-none outline-none text-sm rounded-lg px-4 py-3 w-full my-2 focus:ring-1 focus:ring-primary" />
        
        <a href="#" class="text-tiny text-muted my-4 hover:text-main transition-colors">Forget Your Password?</a>
        
        <button class="bg-primary text-white text-tiny font-bold py-3 px-10 rounded-lg uppercase tracking-wider hover:opacity-90 transition-opacity">
          Sign In
        </button>
      </form>
    </div>

    <div 
      class="absolute top-0 left-1/2 w-1/2 h-full overflow-hidden transition-all duration-700 ease-in-out z-[100]"
      [class]="isActive ? '-translate-x-full rounded-r-[150px]' : 'rounded-l-[150px]'"
    >
      <div 
        class="bg-gradient-to-r from-primary to-secondary text-white relative -left-full h-full w-[200%] transform transition-transform duration-700 ease-in-out"
        [ngClass]="{ 'translate-x-1/2': isActive, 'translate-x-0': !isActive }"
      >
        
        <div 
          class="absolute top-0 flex flex-col items-center justify-center w-1/2 h-full px-8 text-center transition-transform duration-700 ease-in-out"
          [class]="isActive ? 'translate-x-0' : '-translate-x-[200%]'"
        >
          <h1 class="font-bold text-huge mb-4">Welcome Back!</h1>
          <p class="text-sm leading-5 mb-8">Enter your personal details to use all of site features</p>
          <button 
            (click)="toggleActive()"
            class="bg-transparent border border-white text-white text-tiny font-bold py-3 px-10 rounded-lg uppercase tracking-wider hover:bg-white/20 transition-colors"
          >
            Sign In
          </button>
        </div>

        <div 
          class="absolute top-0 right-0 flex flex-col items-center justify-center w-1/2 h-full px-8 text-center transition-transform duration-700 ease-in-out"
          [class]="isActive ? 'translate-x-[200%]' : 'translate-x-0'"
        >
          <h1 class="font-bold text-huge mb-4">Hello, Friend!</h1>
          <p class="text-sm leading-5 mb-8">Register with your personal details to use all of site features</p>
          <button 
            (click)="toggleActive()"
            class="bg-transparent border border-white text-white text-tiny font-bold py-3 px-10 rounded-lg uppercase tracking-wider hover:bg-white/20 transition-colors"
          >
            Sign Up
          </button>
        </div>

      </div>
    </div>
    
  </div>
</div>
